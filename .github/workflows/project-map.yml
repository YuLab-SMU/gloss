name: Project Map (LikeC4 -> gh-pages)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "project-map-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::testthat

      - name: Run live alignment probe & test suite
        run: |
          Rscript .project-map/build_map.R --run-tests --strict --summary "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build LikeC4 static Project Map
        run: |
          npx --yes likec4@latest build \
            --base "/${{ github.event.repository.name }}/" \
            --use-hash-history \
            --title "gloss Project Map" \
            --output .project-map/dist \
            .project-map/model
          cp .project-map/status.json .project-map/dist/status.json
          touch .project-map/dist/.nojekyll

      - name: Deploy to gh-pages branch
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .project-map/dist
          force_orphan: true
          commit_message: "chore(project-map): update LikeC4 site from ${{ github.sha }}"
