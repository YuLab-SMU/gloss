<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gloss-architecture-title gloss-architecture-desc" id="gloss-architecture-root">
        <title id="gloss-architecture-title">gloss 架构设计</title>
        <desc id="gloss-architecture-desc">架构图展示原图和调用方如何进入 gloss 核心，核心如何通过插件扩展、工具边界和核验写入记录，再生成图包、上下文和多种投影。</desc>
        <defs>
      <style>#gloss-architecture-root { --paper: #f7f5ef;
      --ink: #14284b;
      --muted: #5c6b83;
      --accent: #c96f08;
      --link: #315bb6;
      --soft: #6e7d93;
      --font-sans: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #gloss-architecture-root { font-family: var(--font-sans); color: var(--ink); }
      #gloss-architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#gloss-architecture-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="gloss-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5c6b83"/></marker>
          <marker id="gloss-architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c96f08"/></marker>
          <marker id="gloss-architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#315bb6"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f7f5ef"/>

        <!-- Flat zones are painted before arrows and nodes. -->
        <rect x="40" y="64" width="240" height="480" rx="8" fill="#14284b" stroke="#14284b" stroke-width="0.8" stroke-dasharray="6,3" fill-opacity="0.025" stroke-opacity="0.16"/>
        <rect x="126" y="68" width="68" height="12" rx="2" fill="#f7f5ef"/>
        <text x="160" y="77" fill="#6e7d93" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">INPUTS</text>

        <rect x="320" y="64" width="520" height="480" rx="8" fill="#14284b" stroke="#14284b" stroke-width="1" fill-opacity="0.02" stroke-opacity="0.18"/>
        <rect x="548" y="68" width="64" height="12" rx="2" fill="#f7f5ef"/>
        <text x="580" y="77" fill="#6e7d93" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">CORE</text>

        <rect x="880" y="64" width="280" height="480" rx="8" fill="#14284b" stroke="#14284b" stroke-width="0.8" fill-opacity="0.025" stroke-opacity="0.16"/>
        <rect x="976" y="68" width="88" height="12" rx="2" fill="#f7f5ef"/>
        <text x="1020" y="77" fill="#6e7d93" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">OUTPUTS</text>

        <!-- Connectors are painted before nodes. -->
        <path d="M248 256 H296 Q304 256 304 248 V176 Q304 168 312 168 H344" fill="none" stroke="#c96f08" stroke-width="1.4" marker-end="url(#gloss-architecture-arrow-accent)"/>
        <line x1="444" y1="208" x2="444" y2="288" stroke="#5c6b83" stroke-width="1.2" marker-end="url(#gloss-architecture-arrow)"/>
        <line x1="544" y1="328" x2="592" y2="328" stroke="#5c6b83" stroke-width="1.2" marker-end="url(#gloss-architecture-arrow)"/>
        <line x1="692" y1="368" x2="692" y2="432" stroke="#5c6b83" stroke-width="1.2" marker-end="url(#gloss-architecture-arrow)"/>
        <path d="M248 288 H288 Q296 288 296 296 V472 Q296 480 304 480 H344" fill="none" stroke="#315bb6" stroke-width="1.1" stroke-dasharray="5,4" marker-end="url(#gloss-architecture-arrow-link)"/>
        <line x1="444" y1="432" x2="444" y2="368" stroke="#315bb6" stroke-width="1.1" stroke-dasharray="5,4" marker-end="url(#gloss-architecture-arrow-link)"/>
        <line x1="544" y1="472" x2="592" y2="472" stroke="#315bb6" stroke-width="1.1" marker-end="url(#gloss-architecture-arrow-link)"/>
        <line x1="592" y1="168" x2="544" y2="168" stroke="#5c6b83" stroke-width="1.1" marker-end="url(#gloss-architecture-arrow)"/>
        <path d="M792 168 H824 Q832 168 832 176 V416 Q832 424 824 424 H792" fill="none" stroke="#5c6b83" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#gloss-architecture-arrow)"/>
