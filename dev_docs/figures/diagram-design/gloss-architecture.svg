        <line x1="1020" y1="240" x2="1020" y2="336" stroke="#5c6b83" stroke-width="1.2" marker-end="url(#gloss-architecture-arrow)"/>

        <!-- Open-space arrow labels, each with an opaque paper mask. -->
        <rect x="252" y="236" width="52" height="12" rx="2" fill="#f7f5ef"/>
        <text x="278" y="245" fill="#c96f08" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CAPTURE</text>
        <rect x="396" y="394" width="40" height="12" rx="2" fill="#f7f5ef"/>
        <text x="416" y="403" fill="#315bb6" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">READ</text>
        <rect x="802" y="328" width="48" height="12" rx="2" fill="#f7f5ef"/>
        <text x="826" y="337" fill="#c96f08" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">WRITE</text>
        <rect x="944" y="276" width="56" height="12" rx="2" fill="#f7f5ef"/>
        <text x="972" y="285" fill="#5c6b83" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">EMBED</text>

        <!-- Node helper pattern: paper mask, styled box, tag, name, technical sublabel. -->
        <!-- Inputs -->
        <rect x="72" y="216" width="176" height="80" rx="6" fill="#f7f5ef"/>
        <rect x="72" y="216" width="176" height="80" rx="6" fill="#5c6b83" stroke="#5c6b83" stroke-width="1" fill-opacity="0.10"/>
        <rect x="80" y="224" width="36" height="12" rx="2" fill="none" stroke="#5c6b83" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="98" y="233" fill="#5c6b83" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">INPUT</text>
        <text x="160" y="260" fill="#14284b" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="middle">图与调用方</text>
        <text x="160" y="278" fill="#5c6b83" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">R plot · human · agent</text>

        <!-- Capture focal -->
        <rect x="344" y="128" width="200" height="80" rx="6" fill="#f7f5ef"/>
        <rect x="344" y="128" width="200" height="80" rx="6" fill="#c96f08" stroke="#c96f08" stroke-width="1.2" fill-opacity="0.12"/>
        <rect x="352" y="136" width="52" height="12" rx="2" fill="none" stroke="#c96f08" stroke-width="0.8" stroke-opacity="0.60"/>
        <text x="378" y="145" fill="#c96f08" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FOCAL</text>
        <text x="444" y="172" fill="#c96f08" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="middle">页面捕获</text>
        <text x="444" y="190" fill="#5c6b83" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">gloss() · device</text>

        <!-- Plugin registry -->
        <rect x="592" y="128" width="200" height="80" rx="6" fill="#f7f5ef"/>
        <rect x="592" y="128" width="200" height="80" rx="6" fill="#14284b" stroke="#5c6b83" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02"/>
        <rect x="600" y="136" width="44" height="12" rx="2" fill="none" stroke="#5c6b83" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="622" y="145" fill="#5c6b83" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PLUGIN</text>
        <text x="692" y="172" fill="#14284b" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="middle">插件注册表</text>
        <text x="692" y="190" fill="#5c6b83" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">engines · checks · ops</text>

        <!-- Substrate -->
        <rect x="344" y="288" width="200" height="80" rx="6" fill="#f7f5ef"/>
        <rect x="344" y="288" width="200" height="80" rx="6" fill="#ffffff" stroke="#14284b" stroke-width="1"/>
        <rect x="352" y="296" width="48" height="12" rx="2" fill="none" stroke="#14284b" stroke-width="0.8" stroke-opacity="0.44"/>
        <text x="376" y="305" fill="#14284b" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">DATA</text>
        <text x="444" y="332" fill="#14284b" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="middle">只读底座</text>
        <text x="444" y="350" fill="#5c6b83" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">elements · panels · rows</text>

        <!-- Records -->
        <rect x="592" y="288" width="200" height="80" rx="6" fill="#f7f5ef"/>
        <rect x="592" y="288" width="200" height="80" rx="6" fill="#14284b" stroke="#5c6b83" stroke-width="1" fill-opacity="0.06"/>
        <rect x="600" y="296" width="48" height="12" rx="2" fill="none" stroke="#5c6b83" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="624" y="305" fill="#5c6b83" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">STORE</text>
        <text x="692" y="332" fill="#14284b" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="middle">追加记录</text>
        <text x="692" y="350" fill="#5c6b83" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">anchors · JSONL layers</text>

        <!-- Tool boundary -->
        <rect x="344" y="432" width="200" height="80" rx="6" fill="#f7f5ef"/>
        <rect x="344" y="432" width="200" height="80" rx="6" fill="#315bb6" stroke="#315bb6" stroke-width="1" fill-opacity="0.08"/>
        <rect x="352" y="440" width="44" height="12" rx="2" fill="none" stroke="#315bb6" stroke-width="0.8" stroke-opacity="0.52"/>
        <text x="374" y="449" fill="#315bb6" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">API</text>
        <text x="444" y="476" fill="#14284b" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="middle">工具边界</text>
        <text x="444" y="494" fill="#5c6b83" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">gl_tools() · /mcp</text>

        <!-- Verification -->
        <rect x="592" y="432" width="200" height="80" rx="6" fill="#f7f5ef"/>
        <rect x="592" y="432" width="200" height="80" rx="6" fill="#ffffff" stroke="#14284b" stroke-width="1"/>
        <rect x="600" y="440" width="48" height="12" rx="2" fill="none" stroke="#14284b" stroke-width="0.8" stroke-opacity="0.44"/>
        <text x="624" y="449" fill="#14284b" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">GATE</text>
        <text x="692" y="476" fill="#14284b" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="middle">核验与重基</text>
        <text x="692" y="494" fill="#5c6b83" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">schema · checks · rebase</text>

        <!-- Bundle -->
        <rect x="912" y="160" width="216" height="80" rx="6" fill="#f7f5ef"/>
        <rect x="912" y="160" width="216" height="80" rx="6" fill="#14284b" stroke="#5c6b83" stroke-width="1" fill-opacity="0.06"/>
        <rect x="920" y="168" width="44" height="12" rx="2" fill="none" stroke="#5c6b83" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="942" y="177" fill="#5c6b83" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">BUNDLE</text>
        <text x="1020" y="204" fill="#14284b" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="middle">图包与上下文</text>
        <text x="1020" y="222" fill="#5c6b83" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">manifest · packet · rows</text>

        <!-- Projections -->
        <rect x="912" y="336" width="216" height="80" rx="6" fill="#f7f5ef"/>
        <rect x="912" y="336" width="216" height="80" rx="6" fill="#ffffff" stroke="#14284b" stroke-width="1"/>
        <rect x="920" y="344" width="44" height="12" rx="2" fill="none" stroke="#14284b" stroke-width="0.8" stroke-opacity="0.44"/>
        <text x="942" y="353" fill="#14284b" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">VIEW</text>
        <text x="1020" y="380" fill="#14284b" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif" text-anchor="middle">投影与运行时</text>
        <text x="1020" y="398" fill="#5c6b83" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">HTML · SVG · ARIA · text</text>

        <!-- Legend -->
        <line x1="40" y1="572" x2="1160" y2="572" stroke="#14284b" stroke-width="0.8" stroke-opacity="0.14"/>
        <text x="40" y="592" fill="#5c6b83" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="40" y="608" width="16" height="12" rx="2" fill="#c96f08" stroke="#c96f08" stroke-width="1.2" fill-opacity="0.12"/>
        <text x="68" y="617" fill="#5c6b83" font-size="10" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif">关键入口</text>
        <rect x="160" y="608" width="16" height="12" rx="2" fill="#ffffff" stroke="#14284b" stroke-width="1"/>
        <text x="188" y="617" fill="#5c6b83" font-size="10" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif">核心数据或检查</text>
        <rect x="324" y="608" width="16" height="12" rx="2" fill="#14284b" stroke="#5c6b83" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02"/>
        <text x="352" y="617" fill="#5c6b83" font-size="10" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif">可替换插件</text>
        <line x1="476" y1="614" x2="508" y2="614" stroke="#315bb6" stroke-width="1.1" stroke-dasharray="5,4" marker-end="url(#gloss-architecture-arrow-link)"/>
        <text x="520" y="617" fill="#5c6b83" font-size="10" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif">只读读取或外部调用</text>
        <text x="776" y="617" fill="#5c6b83" font-size="10" font-style="italic" font-family="'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif">模型循环在边界外，propose 仍由核心核验。</text>
      </svg>
