<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gloss 标注工作台</title>
<!--
  Label workbench (M1 plan Task 1). Served by serve.py; see its header.
  One leaf at a time: the leaf is outlined on the page the figure's code
  drew, the annotator answers the guideline's questions with the number
  keys, and the server writes the label files. Roles, kinds, questions and
  cases come from bench/labels/vocabulary.json. Text from figures is written
  with textContent only.

  With several annotators (serve.py --team) the page first asks for a
  nickname. The others' labels of a figure are asked for, and shown, only
  after the annotator's own labels of it are frozen; the server decides.

  Aids to see what a leaf is (they change the view only, never the figure or
  a label): fill and stroke as the browser computes them, with "none" told
  apart from white; painting the leaf; the leaf alone on a checkerboard;
  hiding it; hiding what was drawn after it; dragging it aside; its place in
  the drawing order; the guideline's worked examples of the same class.

  Standard examples: every role and kind is shown, beside its option, as it
  appears in the guideline's worked examples (a role in each example figure,
  a kind as the leaves the vocabulary names for it); pointing at an option
  enlarges them, a click on the small picture opens them large (the whole
  figure beside the detail), E shows them all.

  The page is drawn with a margin around it, so that the outline of a leaf
  at the page's edge is not cut off. A guide (G) says what to do; it opens
  by itself the first time.
-->
<style>
  :root {
    --bg: #f4f3ef; --panel: #ffffff; --ink: #1c1c1e; --muted: #6e6e73; --line: #e3e1da; --soft: #f7f6f2;
    --hl: #e6007e; --ok: #0a7d4f;
    --data: #2563eb; --guide: #0a8f66; --reference: #7c3aed; --annotation: #c76a00; --decoration: #5f6672;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  header { display: flex; align-items: center; gap: 14px; padding: 8px 16px; background: var(--panel);
           border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
  header .brand { font-weight: 650; letter-spacing: .01em; }
  header .who { color: var(--muted); font-size: 12px; }
  #tabs { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
  .tab { border: 1px solid var(--line); background: var(--soft); border-radius: 999px; padding: 3px 10px 3px 6px;
         font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 6px; color: var(--ink); }
  .tab.on { border-color: var(--ink); background: var(--panel); }
  .tab .ring { width: 14px; height: 14px; border-radius: 50%; background: conic-gradient(var(--ok) var(--p, 0%), #dddbd3 0); }
  .tab.done .ring { background: var(--ok); }
  #total { font-size: 12px; color: var(--muted); white-space: nowrap; }
  #total b { color: var(--ink); font-variant-numeric: tabular-nums; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 540px; gap: 14px; padding: 14px 16px; align-items: start; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  #stage { padding: 10px; position: sticky; top: 58px; }
  #page svg { display: block; width: 100%; height: auto; max-height: calc(100vh - 150px); background: #e9e7df; }
  #page, #loupe { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #fff; }
  .wb-dim [data-gloss-leaf]:not(.wb-cur) { opacity: .42; }
  .wb-hl rect { fill: none; vector-effect: non-scaling-stroke; pointer-events: none; }
  .wb-hl .under { stroke: #fff; stroke-width: 4.5px; }
  .wb-hl .over { stroke: var(--hl); stroke-width: 2px; stroke-dasharray: 6 3; }
  details { margin-top: 8px; }
  details > summary { cursor: pointer; color: var(--muted); font-size: 12px; user-select: none; }
  #code pre { margin: 6px 0 0; padding: 10px; background: var(--soft); border-radius: 6px; max-height: 320px; overflow: auto;
              font-size: 12px; line-height: 1.5; white-space: pre-wrap; }
  #panel { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  #body { display: flex; flex-direction: column; gap: 8px; }
  #loupe svg { display: block; width: 100%; aspect-ratio: 16 / 7; background: #e9e7df; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .meta .where { font-weight: 650; font-variant-numeric: tabular-nums; margin-right: 2px; }
  .chip { border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; font-size: 12px; background: var(--soft); }
  .chip.text { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px; border: 1px solid rgba(0,0,0,.25); vertical-align: -1px; margin-right: 4px; }
  .path { font-size: 11px; color: var(--muted); word-break: break-all; line-height: 1.35; }
  .now { font-size: 13px; padding: 6px 8px; border-radius: 6px; background: var(--soft); }
  .now b { font-weight: 650; }
  .choices { display: grid; grid-template-columns: 1fr; gap: 5px; }
  .choices.kinds { grid-template-columns: 1fr 1fr; }
  .choices h3 { grid-column: 1 / -1; }
  .choices h3 { margin: 2px 0; font-size: 12px; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; }
  .opt { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start; text-align: left; width: 100%;
         border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 8px; cursor: pointer; color: inherit; font: inherit; }
  .opt:hover { border-color: #b9b6ab; background: var(--soft); }
  .opt .name { font-weight: 650; }
  .opt .hint { display: block; color: var(--muted); font-size: 11.5px; line-height: 1.3; }
  .opt.repeat { grid-template-columns: 26px 1fr; }
  .opt.repeat .hint { display: inline; margin-left: 8px; font-size: 12.5px; }
  kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 5px;
        border: 1px solid #c9c6bb; border-bottom-width: 2px; border-radius: 5px; background: #fff; font: 600 12px ui-monospace, Menlo, monospace; color: var(--ink); }
  .repeat { border-style: dashed; }
  .tools { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 12px; color: var(--muted); }
  .tools .tool { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; background: none; border: 0; padding: 0; color: inherit; font: inherit; }
  .tools .tool.on { color: var(--hl); font-weight: 600; }
  #note { flex: 1; min-width: 120px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 7px; font: inherit; font-size: 12px; }
  #dots { display: flex; flex-wrap: wrap; gap: 3px; }
  .dot { width: 12px; height: 12px; border-radius: 3px; background: #dddbd3; cursor: pointer; border: 0; padding: 0; }
  .dot.el { width: 7px; border-radius: 2px; }
  .dot.cur { outline: 2px solid var(--ink); outline-offset: 1px; }
  .done-card { text-align: center; padding: 18px 10px; }
  .done-card .big { font-size: 20px; font-weight: 700; color: var(--ok); }
  .done-card p { margin: 6px 0; color: var(--muted); }
  .btn { border: 1px solid var(--ink); background: var(--ink); color: #fff; border-radius: 8px; padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  #cases ul { margin: 6px 0 0; padding-left: 18px; color: var(--ink); font-size: 12px; }
  #cases li { margin: 3px 0; }
  #loupe.iso svg { background: repeating-conic-gradient(#b9b9b9 0% 25%, #e4e4e4 0% 50%) 50% / 14px 14px; }
  .wb-iso [data-gloss-leaf]:not(.wb-cur), .wb-iso .wb-loose { visibility: hidden; }
  .wb-above, .wb-hidecur .wb-cur { visibility: hidden; }
  #page svg.movable .wb-cur { cursor: grab; }
  .sw.none { background: repeating-conic-gradient(#a9a9a9 0% 25%, #e4e4e4 0% 50%) 50% / 6px 6px; }
  .chip.warn { border-color: var(--hl); color: var(--hl); background: #fff; }
  .layer { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .layer b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .hint2 { font-size: 11.5px; color: var(--muted); line-height: 1.4; }
  .refs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .refcard { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; font-size: 11.5px; }
  .refcard svg { display: block; width: 100%; aspect-ratio: 16 / 9; background: #fff; }
  .refcard div { padding: 3px 6px; }
  .opt.ex { grid-template-columns: 26px 1fr auto; }
  .thumb { display: block; width: 86px; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: #fff; align-self: center; }
  .thumb svg, .excard svg { display: block; width: 100%; aspect-ratio: 16 / 10; background: #fff; }
  .thumbs { display: flex; gap: 4px; align-self: center; cursor: zoom-in; position: relative; }
  .thumbs:hover .thumb { border-color: var(--ink); }
  .thumbs .more { position: absolute; right: 2px; bottom: 2px; background: var(--ink); color: #fff; border-radius: 8px; font-size: 10px; padding: 0 5px; line-height: 15px; }
  .choices:not(.kinds) .thumb { width: 66px; }
  .sheet.wide { width: min(1180px, 100%); }
  .zoomrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 6px 0 14px; }
  .zoomrow.one { grid-template-columns: 1fr; }
  .zoomrow svg { display: block; width: 100%; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  .zoomrow .cap { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
  .excard.click { cursor: zoom-in; }
  .zoomrow .wb-ex.wb-dim [data-gloss-leaf]:not(.wb-cur), #expreview .wb-ex.wb-dim [data-gloss-leaf]:not(.wb-cur) { opacity: .38; }
  /* a role in the example figure: its leaves in the role's colour (svglite writes fills in the style attribute) */
  .wb-role .wb-cur * { stroke: var(--c) !important; }
  .wb-role .wb-cur [style*="fill: #"], .wb-role .wb-cur text { fill: var(--c) !important; fill-opacity: .6; stroke: none !important; }
  .wb-role .wb-cur text { fill-opacity: 1; }
  .opt.repeat .thumb { width: 60px; }
  .thumb.none { border-style: dashed; color: var(--muted); font-size: 10.5px; text-align: center; padding: 6px 2px; line-height: 1.25; }
  .wb-ex.wb-dim [data-gloss-leaf]:not(.wb-cur) { opacity: .18; }
  #expreview { position: fixed; z-index: 8; width: 470px; display: none; padding: 10px 12px; box-shadow: 0 10px 34px rgba(0, 0, 0, .2); pointer-events: none; }
  #expreview h3 { margin: 0 0 2px; font-size: 14px; }
  #expreview p { margin: 0 0 8px; font-size: 12px; color: var(--muted); }
  .exgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .exgrid.one { grid-template-columns: 1fr; }
  .excard { font-size: 11.5px; color: var(--muted); }
  .excard svg { border: 1px solid var(--line); border-radius: 6px; }
  .excard b { color: var(--ink); }
  .guide ol, .guide ul { margin: 4px 0; padding-left: 20px; font-size: 13px; line-height: 1.6; }
  .guide li { margin: 2px 0; }
  .guide kbd { margin: 0 1px; }
  .guide .q { color: var(--muted); }
  .btn.ghost { background: var(--panel); color: var(--ink); margin: 3px; }
  .link { background: none; border: 0; padding: 0; color: var(--data); cursor: pointer; font: inherit; text-align: left; }
  .overlay { position: fixed; inset: 0; background: rgba(28, 28, 30, .45); z-index: 20; display: none; align-items: flex-start;
             justify-content: center; padding: 5vh 16px; overflow: auto; }
  .overlay.on { display: flex; }
  .sheet { background: var(--panel); border-radius: 12px; border: 1px solid var(--line); padding: 18px 20px; width: min(780px, 100%); }
  .sheet h2 { margin: 0 0 6px; font-size: 18px; }
  .sheet h3 { margin: 18px 0 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .sheet p { margin: 6px 0; color: var(--muted); }
  .sheet p.strong { color: var(--ink); }
  .sheet table { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .sheet th, .sheet td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .sheet th { color: var(--muted); font-weight: 600; }
  .sheet ul { margin: 0; padding-left: 18px; font-size: 12.5px; }
  .sheet li { margin: 4px 0; }
  .field { display: flex; flex-direction: column; gap: 4px; margin: 10px 0; font-size: 12px; color: var(--muted); }
  .field input, .sheet input.own { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 15px; color: var(--ink); width: 100%; }
  .sheet input.own { font-size: 12px; }
  .err { color: #b00020; min-height: 1.4em; font-size: 12.5px; }
  .bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: #dddbd3; min-width: 80px; }
  .bar span { display: block; height: 100%; }
  .peers { border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; }
  .peers h3 { margin: 0; font-size: 12px; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; }
  .ans { display: grid; grid-template-columns: 96px 1fr; gap: 8px; }
  .ans .name { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ans.me .name { color: var(--ink); font-weight: 600; }
  .dot.disp { box-shadow: 0 0 0 2px var(--hl); }
  #toast { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); background: #b00020; color: #fff; padding: 8px 14px;
           border-radius: 8px; font-size: 13px; display: none; z-index: 9; }
</style>
</head>
<body>
<header>
  <span class="brand">gloss 标注工作台</span>
  <span class="who" id="who"></span>
  <div id="tabs"></div>
  <button class="tab" id="help">使用说明（G）</button>
  <button class="tab" id="team" hidden></button>
  <span id="total"></span>
</header>
<main>
  <section class="card" id="stage">
    <div id="page"></div>
    <details id="code"><summary>这张图的代码 code.R（<kbd>C</kbd>）</summary><pre class="mono"></pre></details>
  </section>
  <aside class="card" id="panel">
    <div id="loupe"></div>
    <div id="body"></div>
    <div id="dots"></div>
    <details id="cases"><summary>判例：这些情况已经定好怎么标</summary><ul></ul></details>
  </aside>
</main>
<div class="card" id="expreview"></div>
<div class="overlay" id="join"><div class="sheet" id="joinBody"></div></div>
<div class="overlay" id="over"><div class="sheet" id="overBody"></div></div>
<div id="toast"></div>
<script>
"use strict";
const $ = s => document.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
function h(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "onclick") n.addEventListener("click", v);
    else if (k === "style") n.style.cssText = v;
    else n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(String(c)));
  return n;
}
// Team mode: the annotator's token is kept in this browser and sent in a header.
let TOKEN = null, TEAM = false, REVEAL = null;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private window: the token lasts for this tab */ } },
};
function headers(json) {
  const hd = {};
  if (TOKEN) hd["X-Workbench-Token"] = TOKEN;
  if (json) hd["Content-Type"] = "application/json";
  return hd;
}
async function api(path, body) {
  const opt = { headers: headers(body !== undefined) };
  if (body !== undefined) { opt.method = "POST"; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  let p = null;
  try { p = await r.json(); } catch (e) { /* not JSON */ }
  if (!r.ok) { const e = new Error((p && p.error) || ("HTTP " + r.status)); e.status = r.status; throw e; }
  return p;
}

let CFG = null, VOC = null, FIG = null, S = null;
let items = [], cur = 0, stage = "role", role = null, last = null;
let dim = true, finished = false, draft = { note: "", unsure: false };
let dirty = false, saving = false, saveTimer = null, lastInput = Date.now(), unsavedSeconds = 0;
let roots = [];
// aids: what is shown of the current leaf (the view only)
let paint = false, iso = false, hideCur = false, peel = false, refOpen = false, moved = null;
let painted = [], movedNodes = [], curPaint = null, REF = [], REFK = {}, REFROLE = null;
const thumbs = new Map();

// ---- state ---------------------------------------------------------------
function buildItems() {
  items = [];
  for (const lf of FIG.leaves) {
    if (lf.n === 0) continue;
    const lab = S.labels[lf.k];
    if (lab && lab.split) for (let i = 1; i <= lf.n; i++) items.push({ k: lf.k, el: i });
    else items.push({ k: lf.k, el: null });
  }
}
function getLabel(it) {
  const l = S.labels[it.k];
  if (!l) return null;
  if (it.el) return l.split ? l.split[it.el - 1] : null;
  return l.split ? null : l;
}
function setLabel(it, lab) {
  if (it.el) S.labels[it.k].split[it.el - 1] = lab; else S.labels[it.k] = lab;
}
function nextUnlabelled(from) {
  for (let s = 1; s <= items.length; s++) {
    const i = (from + s) % items.length;
    if (!getLabel(items[i])) return i;
  }
  return -1;
}
function loadDraft() {
  const l = items[cur] && getLabel(items[cur]);
  draft = l ? { note: l.note || "", unsure: !!l.unsure } : { note: "", unsure: false };
}
function markDirty() {
  dirty = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 400);
}
// One save at a time: each names the revision of the labels this page holds
// (S.rev, as loaded or as the save before returned it). The server refuses a
// save from a page that holds an older one, so a page left open elsewhere cannot
// write its old labels over newer ones; this page then loads the newer ones.
let saves = Promise.resolve();
function flush() {
  clearTimeout(saveTimer);
  saves = saves.then(saveNow);
  return saves;
}
async function saveNow() {
  if (!dirty || !FIG) return;
  dirty = false; unsavedSeconds = 0; saving = true;
  const id = FIG.id, st = S;
  try {
    const p = await api("/api/state/" + id, { labels: st.labels, seconds: st.seconds, cursor: cur, rev: st.rev || 0 });
    st.rev = p.rev;
    const f = CFG.figures.find(x => x.id === id);
    Object.assign(f, p);
    saving = false;
    if (FIG.id === id) FIG.file = p.file;
    renderHeader();
    if (finished && FIG.id === id) renderBody();
  } catch (e) {
    saving = false;
    if (e.status === 409) {
      toast("这张图在别的页面（或别的设备）上改过，这个页面里的是旧的：已经载入最新的标注，刚才那一步请再做一次。");
      try { if (FIG && FIG.id === id) await loadFigure(id); } catch (e2) { toast("没有载入成功：" + e2.message + "（请刷新页面）"); }
      return;
    }
    dirty = true;
    toast("没有保存成功：" + e.message + (TEAM ? "（网络断了吗？恢复后再按任意一个键会重新保存）" : "（serve.py 还在运行吗？）"));
  }
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", 6000);
}

// ---- the page --------------------------------------------------------------
function cleanSvg(text) {
  const svg = new DOMParser().parseFromString(text, "image/svg+xml").documentElement;
  svg.querySelectorAll("script, foreignObject, [data-gloss-sheet]").forEach(n => n.remove());
  svg.querySelectorAll("*").forEach(n => { for (const a of [...n.attributes]) if (/^on/i.test(a.name)) n.removeAttribute(a.name); });
  svg.removeAttribute("width"); svg.removeAttribute("height");
  return svg;
}
const SHAPES = "rect, circle, ellipse, line, polyline, polygon, path, text, image, use";
// A page is shown with a margin, so that an outline at its edge is not cut off.
const MARGIN = 7;
const padded = vb => [vb[0] - MARGIN, vb[1] - MARGIN, vb[2] + 2 * MARGIN, vb[3] + 2 * MARGIN];
// The device's page background is a rectangle of 100%: of the view, once there is a margin. Give it the page's size.
function pinPage(svg, vb) {
  svg.querySelectorAll('rect[width="100%"][height="100%"]').forEach(r => {
    r.setAttribute("x", vb[0]); r.setAttribute("y", vb[1]); r.setAttribute("width", vb[2]); r.setAttribute("height", vb[3]);
  });
}
function mountSvg(text) {
  const src = cleanSvg(text);
  FIG.viewBox = (src.getAttribute("viewBox") || "0 0 504 360").split(/\s+/).map(Number);
  pinPage(src, FIG.viewBox);
  src.setAttribute("viewBox", padded(FIG.viewBox).join(" "));
  const main = document.importNode(src, true), loupe = document.importNode(src, true);
  // what the device drew outside every leaf (the page's own background)
  for (const root of [main, loupe]) root.querySelectorAll(SHAPES).forEach(n => { if (!n.closest("[data-gloss-leaf], defs, clipPath")) n.classList.add("wb-loose"); });
  $("#page").replaceChildren(main);
  $("#loupe").replaceChildren(loupe);
  roots = [main, loupe];
  // the drawing order: the order of the leaves in the page
  FIG.groups = [...main.querySelectorAll("[data-gloss-leaf]")].map(g => [g.getAttribute("data-gloss-leaf"), g]);
  FIG.z = Object.fromEntries(FIG.groups.map(([leaf], i) => [leaf, i]));
  painted = []; movedNodes = []; moved = null;
  main.classList.add("movable");

      h("p", { class: "strong" }, "请独立完成：标完之前不要和别人商量，也不要看别人的屏幕。" +
        (hello.reveal === "figure" ? "每标完一张图" : "全部标完后") + "，这里会显示大家各自怎么标的，以及每个叶子和整体的统计。谁标了多少，随时能看。"),
      h("label", { class: "field" }, "给自己起一个昵称（别人没用过的）", nick),
      hello.invite ? h("label", { class: "field" }, "邀请码", inv) : null,
      err,
      h("button", { class: "btn", onclick: submit }, "开始"));
    $("#join").classList.add("on");
    nick.focus();
  });
}

// ---- actions ---------------------------------------------------------------
function pickRole(i) { role = VOC.roles[i].role; stage = "kind"; hidePreview(); renderBody(); }
function resetView() { hideCur = false; peel = false; moved = null; }
function togglePaint() { paint = !paint; highlight(); renderBody(); }
function toggleIso() { iso = !iso; highlight(); renderBody(); }
function toggleHide() { hideCur = !hideCur; highlight(); renderBody(); }
function togglePeel() { peel = !peel; highlight(); renderBody(); }
function resetMove() { moved = null; applyMove(); renderBody(); }
function toggleRef() { refOpen = !refOpen; renderBody(); }
function commit(r, k) {
  // `ref`: the reference examples were open when this label was given
  setLabel(items[cur], Object.assign({ role: r, kind: k, note: draft.note, unsure: draft.unsure }, refOpen ? { ref: true } : {}));
  resetView(); hidePreview();
  last = { role: r, kind: k };
  const f = CFG.figures.find(x => x.id === FIG.id);
  f.labelled = FIG.order.filter(key => leafDone(key)).length;
  dirty = true;
  const nx = nextUnlabelled(cur);
  stage = "role"; role = null;
  if (nx < 0) { finished = true; flush(); } else { cur = nx; markDirty(); }
  loadDraft(); render();
}
function leafDone(k) {
  const l = S.labels[k];
  return !!l && (l.split ? l.split.every(Boolean) : true);
}
function go(i) {
  if (i < 0 || i >= items.length) return;
  resetView();
  cur = i; finished = false; stage = "role"; role = null; loadDraft(); render();
}
function toggleSplit() {
  const it = items[cur], lf = FIG.byK[it.k];
  if (lf.n < 2) return;
  const l = S.labels[it.k];
  if (l && l.split) {
    const a = l.split[0], same = l.split.every(x => x && a && x.role === a.role && x.kind === a.kind);
    if (same) S.labels[it.k] = a; else delete S.labels[it.k];
  } else S.labels[it.k] = { split: Array(lf.n).fill(null) };
  resetView();
  buildItems();
  cur = items.findIndex(x => x.k === it.k);
  finished = false; stage = "role"; markDirty(); loadDraft(); render();
}
function toggleUnsure() {
  draft.unsure = !draft.unsure;
  const l = getLabel(items[cur]); if (l) { l.unsure = draft.unsure; markDirty(); }
  renderBody();
}
function toggleDim() { dim = !dim; highlight(); renderBody(); }

async function openFigure(id) {
  await flush();
  await loadFigure(id);
}
async function loadFigure(id) {
  FIG = await api("/api/figure/" + id);
  indexPeers();
  S = FIG.state; S.labels = S.labels || {}; S.seconds = S.seconds || 0;
  FIG.byK = Object.fromEntries(FIG.leaves.map(l => [l.k, l]));
  FIG.order = FIG.leaves.filter(l => l.n > 0).map(l => l.k);
  FIG.el = {};
  for (const e of FIG.elements) (FIG.el[e.k] = FIG.el[e.k] || [])[e.index - 1] = e;
  FIG.file = (CFG.figures.find(f => f.id === id) || {}).file;
  resetView();
  mountSvg(FIG.svg);
  $("#code pre").textContent = FIG.code || "（没有找到代码）";
  buildItems();
  const first = getLabel(items[0]) ? nextUnlabelled(0) : 0;
  finished = first < 0; cur = finished ? 0 : first;
  stage = "role"; role = null; last = null; loadDraft(); render();
}

function onKey(e) {
  lastInput = Date.now();
  const typing = e.target && e.target.tagName === "INPUT";
  if (typing) { if (e.key === "Enter" || e.key === "Escape") { e.target.blur(); e.preventDefault(); } return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const code = e.code || "";
  if ($("#join").classList.contains("on")) return;
  if ($("#over").classList.contains("on")) {
    if (["Escape", "Enter", "KeyO", "KeyE", "KeyG"].includes(code)) { hideOverview(); if (e.preventDefault) e.preventDefault(); }
    return;
  }
  if (code === "KeyG") { showGuide(); if (e.preventDefault) e.preventDefault(); return; }
  if (TEAM && code === "KeyO") { showOverview(); if (e.preventDefault) e.preventDefault(); return; }
  if (TEAM && code === "KeyX") { nextDisputed(); if (e.preventDefault) e.preventDefault(); return; }
  const digit = /^(Digit|Numpad)(\d)$/.exec(code);
  let used = true;
  if (finished) {
    if (code === "Enter") { const n = CFG.figures.find(x => !x.done && x.id !== FIG.id); if (n) openFigure(n.id); }
    else if (code === "ArrowLeft") go(items.length - 1);
    else used = false;
  } else if (digit) {
    const d = Number(digit[2]);
    if (stage === "role") { if (d >= 1 && d <= VOC.roles.length) pickRole(d - 1); }
    else { const ks = VOC.roles.find(x => x.role === role).kinds, i = d === 0 ? 9 : d - 1; if (ks[i]) commit(role, ks[i].kind); }
  } else if (code === "Space") { if (last) commit(last.role, last.kind); }
  else if (code === "Escape" || code === "Backspace") { stage = "role"; role = null; renderBody(); }
  else if (code === "ArrowLeft") go(cur - 1);
  else if (code === "ArrowRight") go(cur + 1);
  else if (code === "KeyS") toggleSplit();
  else if (code === "KeyU") toggleUnsure();
  else if (code === "KeyD") toggleDim();
  else if (code === "KeyC") { const d = $("#code"); d.open = !d.open; }
  else if (code === "KeyF") togglePaint();
  else if (code === "KeyI") toggleIso();
  else if (code === "KeyH") toggleHide();
  else if (code === "KeyT") togglePeel();
  else if (code === "KeyM") resetMove();
  else if (code === "KeyR") toggleRef();
  else if (code === "KeyE") showExamples();
  else if (code === "KeyN") { const n = $("#note"); if (n) n.focus(); }
  else used = false;
  if (used && e.preventDefault) e.preventDefault();
}

async function boot() {
  let hello = { team: false };
  try { hello = await api("/api/hello"); } catch (e) { if (e.status !== 404) throw e; }   // 404: a server for one annotator
  TEAM = !!hello.team; REVEAL = hello.reveal;
  if (TEAM) {
    // a personal link (#t=<token>) carries an annotator to another browser
    const m = /^#t=([0-9a-f]{32})$/.exec(location.hash);
    if (m) { store.set("wb-token", m[1]); history.replaceState(null, "", location.pathname + location.search); }
    TOKEN = m ? m[1] : store.get("wb-token");
    if (TOKEN) try { CFG = await api("/api/config"); } catch (e) { if (e.status !== 401) throw e; TOKEN = null; }
    if (!CFG) { await join(hello); CFG = await api("/api/config"); }
  } else CFG = await api("/api/config");
  VOC = CFG.vocabulary;
  try {
    const ref = await api("/api/reference");
    REF = ref.figures.map(f => {
      const dom = cleanSvg(f.svg), vb = (dom.getAttribute("viewBox") || "0 0 504 360").split(/\s+/).map(Number);
      pinPage(dom, vb);
      return Object.assign(f, { dom, vb });
    });
    REFK = ref.kinds || {}; REFROLE = ref.figure || null;
  } catch (e) { REF = []; }          // a server without the examples: no reference
  $("#team").addEventListener("click", showOverview);
  $("#help").addEventListener("click", showGuide);
  $("#cases ul").replaceChildren(...VOC.cases.map(c => h("li", { title: c.en }, c.zh)));
  document.addEventListener("keydown", onKey);
  document.addEventListener("pointerdown", () => { lastInput = Date.now(); });
  setInterval(() => {
    if (!FIG || finished || S.independent || document.hidden || Date.now() - lastInput > 60000) return;
    S.seconds++; unsavedSeconds++;
    if (unsavedSeconds >= 15) markDirty();
    renderHeader();
  }, 1000);
  window.addEventListener("pagehide", () => {
    if (FIG && (dirty || unsavedSeconds)) fetch("/api/state/" + FIG.id, { method: "POST", keepalive: true, headers: headers(true),
      body: JSON.stringify({ labels: S.labels, seconds: S.seconds, cursor: cur, rev: S.rev || 0 }) });
  });
  const first = CFG.figures.find(f => !f.done) || CFG.figures[0];
  await openFigure(first.id);
  // Debugging aid: ?keys=Digit1,Digit1,Space replays key codes after loading.
  const replay = new URLSearchParams(location.search).get("keys");
  // the guide opens by itself the first time (not when keys are replayed)
  if (!replay && !store.get("wb-guide")) { showGuide(); store.set("wb-guide", "1"); }
  if (replay) for (const code of replay.split(",")) {
    if (/^Zoom\d$/.test(code)) {    // clicks the pictures of the n-th option
      const t = document.querySelectorAll(".choices .opt .thumbs")[Number(code.slice(4)) - 1];
      if (t) t.click();
    } else if (/^Hover\d$/.test(code)) {   // points at the n-th option
      const b = document.querySelectorAll(".choices .opt")[Number(code.slice(5)) - 1];
      if (b) b.dispatchEvent(new MouseEvent("mouseenter"));
    } else if (code === "Drag") {          // drags the current leaf 90 px right and 60 px up, with pointer events
      const b = FIG.byK[items[cur].k].box, svg = roots[0];
      const c = new DOMPoint((b[0] + b[2]) / 2, (b[1] + b[3]) / 2).matrixTransform(svg.getScreenCTM());
      const ev = (type, dx, dy) => svg.dispatchEvent(new PointerEvent(type, { clientX: c.x + dx, clientY: c.y + dy, button: 0, pointerId: 7, bubbles: true }));
      ev("pointerdown", 0, 0); ev("pointermove", 90, -60); ev("pointerup", 90, -60);
    } else onKey({ code, key: code });
    await new Promise(r => setTimeout(r, 30));
  }
}
boot().catch(e => toast("启动失败：" + e.message));
</script>
